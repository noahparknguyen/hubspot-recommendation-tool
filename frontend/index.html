<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Inbox internal tool — analyze any website's tech stack and surface relevant HubSpot recommendations."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Inbox — HubSpot Recommendation Tool</title>

    <!-- Open Graph / Twitter. og:url and og:image must be absolute — scrapers
         reject relative paths — so they name the deployed origin directly; both
         change if the deployment moves. These coexist with the robots directive
         above: noindex only governs search engines, while these govern link
         unfurls in Slack, Teams and Discord, which is where this tool actually
         gets shared. og-image.png is exported from docs/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HubSpot Recommendation Tool" />
    <meta property="og:title" content="HubSpot Recommendation Tool" />
    <meta
      property="og:description"
      content="See what a prospect's site runs — and which HubSpot products could replace it."
    />
    <meta
      property="og:url"
      content="https://github.com/noahparknguyen/hubspot-recommendation-tool"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/noahparknguyen/hubspot-recommendation-tool/main/frontend/public/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="HubSpot Recommendation Tool — see what a prospect's site runs and which HubSpot products could replace it"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HubSpot Recommendation Tool" />
    <meta
      name="twitter:description"
      content="See what a prospect's site runs — and which HubSpot products could replace it."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
